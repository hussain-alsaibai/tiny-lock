[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-lock"
version = "0.1.0"
description = "Zero-dependency async + file-based distributed lock"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Hussain AlSaibai", email = "hussain.alsaibai@gmail.com"},
]
keywords = [
    "lock",
    "mutex",
    "distributed-lock",
    "filelock",
    "asyncio",
    "async",
    "semaphore",
    "reentrant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-lock"
Repository = "https://github.com/hussain-alsaibai/tiny-lock"
Issues = "https://github.com/hussain-alsaibai/tiny-lock/issues"

[tool.setuptools]
py-modules = ["tiny_lock"]